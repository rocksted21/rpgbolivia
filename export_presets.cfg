[preset.0]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="account/lootlocker.cfg,assets/**/*.json,update/runtime.cfg"
exclude_filter="tests/*,tools/*,build/*,servidor/*,*.md"
export_path="build/Combate Tatico.exe"
script_export_mode=2

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=false
codesign/enable=false
application/product_name="Combate Tatico"

[preset.1]
name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter="account/lootlocker.cfg,assets/**/*.json,update/runtime.cfg"
exclude_filter="tests/*,tools/*,build/*,servidor/*,*.md"
export_path="build/Combate Tatico.apk"
script_export_mode=2

[preset.1.options]
gradle_build/use_gradle_build=false
architectures/arm64-v8a=true
architectures/armeabi-v7a=false
package/unique_name="com.rocksted.combatetatico"
package/name="Combate Tatico"
permissions/internet=true
permissions/access_network_state=true

[preset.2]
name="Web"
platform="Web"
runnable=false
export_filter="all_resources"
include_filter="account/lootlocker.cfg,assets/**/*.json"
exclude_filter="tests/*,tools/*,build/*,servidor/*,*.md"
export_path="../site/build/web/index.html"
script_export_mode=2

[preset.2.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
