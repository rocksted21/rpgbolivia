name: Build macOS launcher

on:
  push:
    paths: [launcher.zip, .github/workflows/macos.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-launcher
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2 and templates
        run: |
          curl --fail --location --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          unzip -q godot.zip
          curl --fail --location --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          mv templates/* "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"
      - name: Export minimal universal macOS app
        run: |
          unzip -q launcher.zip -d launcher
          mkdir -p installers
          GODOT="$PWD/Godot.app/Contents/MacOS/Godot"
          "$GODOT" --headless --path launcher --editor --import --quit
          "$GODOT" --headless --path launcher --export-release macOS "$PWD/installers/CombateTatico.app"
          codesign --force --deep --sign - installers/CombateTatico.app
          codesign --verify --deep --strict installers/CombateTatico.app
          mkdir dmg
          ditto installers/CombateTatico.app dmg/CombateTatico.app
          ln -s /Applications dmg/Applications
          hdiutil create -volname 'Combate Tatico' -srcfolder dmg -format UDZO installers/CombateTatico.dmg
          hdiutil verify installers/CombateTatico.dmg
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(cat release-tag.txt)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title 'Combate Tatico — instaladores mínimos' --notes 'O instalador baixa o jogo na primeira abertura e verifica novas versões pelo version.json. macOS: app com assinatura ad hoc, sem notarização Apple.'
          fi
          gh release upload "$TAG" installers/CombateTatico.dmg --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: CombateTatico-macOS
          path: installers/CombateTatico.dmg
